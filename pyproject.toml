[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "janus"
version = "0.1.0"
description = "AI agent security testing platform with Red Team and Blue Team agents."
readme = "README.md"
requires-python = ">=3.13"

license = {text = "MIT"}

authors = [
    {name = "GorkaEgor4kas", email = "gorkaegor4kas@gmail.com"}
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "langgraph>=1.2.0",
    "langchain-core>=1.5.0",
    "langchain-groq>=1.0.0",
    "python-dotenv>=1.2.0",
    "pydantic>=2.12.0",
    "typer>=0.25.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2.0",
]

[project.scripts]
janus = "janus.cli.main:app"